name: Terraform — Cluster Kubernetes (EKS)

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  # Disparo 100% manual — nenhum push/PR aciona plan/apply/destroy automaticamente.
  workflow_dispatch:
    inputs:
      action:
        description: 'Ação a executar'
        required: true
        default: 'plan'
        type: choice
        options: [plan, apply, destroy]
      environment:
        description: 'Ambiente alvo'
        required: true
        default: 'dev'
        type: choice
        options: [dev, staging, prod]

# ── Variáveis globais ──────────────────────────────────────────────────────────
# Secrets (Settings → Secrets):   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
#                                  NEWRELIC_API_KEY, NEWRELIC_LICENSE_KEY
# Variables (Settings → Variables): AWS_REGION, TF_STATE_BUCKET, CLUSTER_NAME,
#                                    NEWRELIC_ACCOUNT_ID, NEWRELIC_NOTIFICATION_EMAIL
env:
  AWS_REGION:                  ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_STATE_BUCKET:             ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_newrelic_account_id:  ${{ vars.NEWRELIC_ACCOUNT_ID }}
  TF_VAR_newrelic_api_key:     ${{ secrets.NEWRELIC_API_KEY }}
  TF_VAR_newrelic_license_key: ${{ secrets.NEWRELIC_LICENSE_KEY }}
  TF_VAR_newrelic_notification_email: ${{ vars.NEWRELIC_NOTIFICATION_EMAIL }}

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action }} (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest
    environment: oficina-prd

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7.0.1

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~1.9'

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=oficina-mecanica/infra-kube/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform Validate
        run: terraform validate

      # ── Plan ─────────────────────────────────────────────────────────────
      - name: Terraform Plan
        if: github.event.inputs.action == 'plan'
        run: |
          terraform plan -input=false \
            -var="environment=${{ github.event.inputs.environment }}"

      # ── Apply ────────────────────────────────────────────────────────────
      # Bootstrap em 2 etapas: os providers kubernetes/helm (usados pelo monitoramento
      # de cluster do New Relic, newrelic-k8s.tf) dependem de outputs do module.eks,
      # que não existem no primeiro apply (cluster ainda não existe).
      - name: Terraform Apply — Etapa 1 (VPC + EKS)
        if: github.event.inputs.action == 'apply'
        run: |
          terraform apply -input=false -auto-approve \
            -var="environment=${{ github.event.inputs.environment }}" \
            -target=module.vpc -target=module.eks

      - name: Terraform Apply — Etapa 2 (New Relic)
        if: github.event.inputs.action == 'apply'
        run: |
          terraform apply -input=false -auto-approve \
            -var="environment=${{ github.event.inputs.environment }}"

      # ── Destroy ──────────────────────────────────────────────────────────
      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        run: |
          terraform destroy -input=false -auto-approve \
            -var="environment=${{ github.event.inputs.environment }}"

      - name: Resumo
        if: always()
        run: |
          echo "### Terraform ${{ github.event.inputs.action }} — infra-kube" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Ambiente | \`${{ github.event.inputs.environment }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Ação | \`${{ github.event.inputs.action }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
